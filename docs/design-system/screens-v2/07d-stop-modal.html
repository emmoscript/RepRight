<body class="bg-background text-on-surface font-body min-h-screen overflow-hidden">
<!-- BACKGROUND: SCREEN 8C (Live Session Context) -->
<main class="relative w-full h-screen overflow-hidden">
<!-- Live Session Content (Blurred in background) -->
<div class="absolute inset-0 z-0">
<img alt="fit man doing intense workout in a dark boutique gym with orange lighting accents" class="w-full h-full object-cover opacity-40" data-alt="fit man doing intense workout in a dark boutique gym with orange lighting accents" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6MB18VdXpn1wn5L4OMtyIDQSRUPCgRifbQXqChd_vjP9eofbbgxLrg3Os64oHe66bkrVordhLNMWhpEr5bVSNLS-dwp-9d1stpnDl5LriUVqEZ-sPxgikcjQHl6RjElqOYGtPOCLp7HYB9xsWW9j9_C0x0iPmXbmlw6saJvBdSvoc3CKXNUjyUE49q7GTZ1ocVfoL0mAZOIBwysnq0lurCP-zJzUdyQOlS5zySA2DsLbcFKV9ZMBQDFZDxJs1Fz4Ceh83oEL4mbY"/>
<!-- Top Bar Mockup (Shared Component Reference) -->
<header class="fixed top-0 left-0 w-full z-10 flex justify-between items-center px-6 py-4 bg-transparent backdrop-blur-md rounded-b-3xl">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-orange-400">arrow_back</span>
<h1 class="text-white font-headline font-bold text-lg">RepRight Live</h1>
</div>
<span class="material-symbols-outlined text-orange-400">volume_up</span>
</header>
<!-- Metric Overlay Mockup -->
<div class="absolute bottom-12 left-6 right-6 flex flex-col gap-6">
<div class="flex justify-between items-end">
<div>
<p class="font-label text-on-surface-variant text-sm uppercase tracking-widest">Current Set</p>
<p class="font-mono text-6xl font-bold text-white">05</p>
</div>
<div class="text-right">
<p class="font-label text-on-surface-variant text-sm uppercase tracking-widest">Heart Rate</p>
<p class="font-mono text-4xl font-bold text-primary">142</p>
</div>
</div>
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-primary-container"></div>
</div>
</div>
</div>
<!-- MODAL OVERLAY (8D) -->
<div class="fixed inset-0 z-[100] modal-overlay backdrop-blur-sm flex items-center justify-center px-6">
<!-- Modal Card -->
<div class="w-full max-w-[320px] bg-[#1A1917] rounded-[24px] p-[28px] flex flex-col items-center animate-in fade-in zoom-in duration-300">
<!-- Warning Icon -->
<div class="mb-5">
<span class="material-symbols-outlined text-[#E84040] text-[40px]" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<!-- Title -->
<h2 class="text-white font-headline font-bold text-[22px] text-center mb-3">
          End Session?
        </h2>
<!-- Body Text -->
<p class="text-[#9A9590] font-body text-[14px] leading-relaxed text-center mb-6">
          Your progress will be saved up to this point, but the current set will not be recorded.
        </p>
<!-- Summary Card -->
<div class="w-full bg-[#222019] rounded-[16px] p-[12px_16px] mb-8">
<div class="flex justify-center mb-1">
<p class="font-mono font-semibold text-[13px] text-white tracking-tight">
              SET 2 · 5 REPS · 01:24
            </p>
</div>
<div class="flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-[#27C34F] text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-body text-[12px] text-[#27C34F]">
              Completed sets are safe.
            </p>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-[10px]">
<!-- Primary Safety Action -->
<button class="w-full h-[52px] bg-[#222019] text-[#E6E1E1] font-headline font-bold rounded-[14px] active:scale-95 transition-transform">
            KEEP GOING
          </button>
<!-- Destructive Action -->
<button class="w-full h-[52px] bg-[#E84040] text-white font-headline font-bold rounded-[14px] active:scale-95 transition-transform">
            END SESSION
          </button>
</div>
</div>
</div>
