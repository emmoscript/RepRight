<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "tertiary-container": "#c49814",
                  "on-tertiary": "#3e2e00",

                  "outline-variant": "#564337",
                  "surface-container-highest": "#363434",
                  "on-secondary-fixed-variant": "#49473e",
                  "tertiary-fixed": "#ffdf97",
                  "secondary-fixed": "#e8e2d7",
                  "primary-fixed-dim": "#ffb68b",
                  "secondary": "#cbc6bb",
                  "primary-container": "#f08030",
                  "on-background": "#e6e1e1",
                  "on-surface": "#e6e1e1",
                  "surface-dim": "#141313",
                  "surface-bright": "#3a3939",
                  "on-secondary-fixed": "#1d1c15",
                  "on-error": "#690005",
                  "on-tertiary-fixed-variant": "#5a4400",
                  "on-primary-fixed": "#321300",

                  "error": "#ffb4ab",
                  "secondary-fixed-dim": "#cbc6bb",
                  "primary-fixed": "#ffdbc8",
                  "surface-variant": "#363434",
                  "on-primary-container": "#5a2700",
                  "tertiary-fixed-dim": "#f0c040",
                  "on-surface-variant": "#ddc1b2",

                  "on-secondary-container": "#bab5aa",

          "borderRadius": {

                  "xl": "3rem",

          "fontFamily": {
                  "headline": ["Plus Jakarta Sans"],
                  "body": ["Be Vietnam Pro"],

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .kinetic-gradient {
      background: radial-gradient(circle at 45% 45%, #ffb68b 0%, #f08030 100%);
    }
    .tonal-glass {
      background: rgba(54, 52, 52, 0.6);
      backdrop-filter: blur(20px);
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col items-center selection:bg-primary-container selection:text-white">
<!-- TopAppBar Type C -->
<header class="w-full max-w-md bg-transparent flex items-center justify-between px-6 py-6 sticky top-0 z-50">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-[#222019] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#F0EDE8]" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline text-[22px] font-[800] flex items-center tracking-tight">
<span class="text-[#F0EDE8] italic">Rep</span><span class="text-[#F08030] italic">Right</span>
</div>
<div class="w-12"></div> <!-- Spacer -->
</header>
<main class="w-full max-w-md px-8 pt-12 pb-16 flex flex-col flex-grow">
<!-- Hero Header -->
<div class="mb-10">
<h1 class="font-headline text-[28px] font-bold text-on-surface leading-tight mb-2">Welcome back</h1>
<p class="text-on-surface-variant font-body">Sign in to continue your training</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div class="space-y-4">
<!-- Email Input -->
<div class="relative">
<input class="w-full h-14 px-5 bg-[#1A1917] border-none rounded-[14px] text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-primary-container/30 transition-all font-body" placeholder="Email" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<input class="w-full h-14 px-5 bg-[#1A1917] border-none rounded-[14px] text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-primary-container/30 transition-all font-body" placeholder="Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="text-[#F08030] text-[13px] font-medium font-label hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<!-- CTA -->
<button class="kinetic-gradient w-full h-[56px] rounded-[16px] text-on-primary font-headline font-extrabold tracking-widest text-sm hover:opacity-90 transition-opacity shadow-[0px_12px_32px_rgba(240,128,48,0.15)] active:scale-[0.98] duration-200" type="submit">
        SIGN IN
      </button>
</form>
<!-- Divider -->
<div class="relative my-12 flex items-center">
<div class="flex-grow h-px bg-outline-variant/15"></div>
<span class="px-4 text-on-surface-variant/40 font-label text-xs uppercase tracking-tighter">or</span>
<div class="flex-grow h-px bg-outline-variant/15"></div>
</div>
<!-- Social Login/Alt Options -->
<div class="grid grid-cols-2 gap-4">
<button class="h-14 rounded-[14px] bg-surface-container hover:bg-surface-container-high transition-colors flex items-center justify-center border border-outline-variant/5">
<img alt="Google" class="w-5 h-5 grayscale opacity-70" data-alt="Google company logo icon with muted colors to match dark theme" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7YUD02HYEumFK_nYSOyJOGLc8K6wo8Xn6sSmpJ5ZVrK91ixw7Av_KalyT2OwwrxxSmDkhKidf2fc1WhmJLipH-Otj-P-1trJUMtptNozvw0tqWUwNau6MTyTxLLCVARBVecJM4pHTfNjvi8_FQ9ee1bXIyQN0ITto49zobEvNJCkKp0TeE0H0AhCHX4S4eSKBmtGGr37N1OTRwh3LeCSECEcQrAr-GJkcR5Wivbbh5SvmzD5J-H3XRKeeTweopZaVTdNa0PpQEvs"/>
</button>
<button class="h-14 rounded-[14px] bg-surface-container hover:bg-surface-container-high transition-colors flex items-center justify-center border border-outline-variant/5">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
</button>
</div>
<!-- Background Decoration -->
<div class="fixed -bottom-20 -left-20 w-64 h-64 bg-primary-container/5 blur-[100px] rounded-full -z-10"></div>
<div class="fixed top-1/4 -right-20 w-80 h-80 bg-tertiary-container/5 blur-[120px] rounded-full -z-10"></div>
<!-- Footer -->
<div class="mt-auto pt-10 text-center">
<a class="group text-on-surface-variant font-body text-sm inline-flex items-center gap-1.5 transition-all" href="#">
        New to RepRight? <span class="text-[#F08030] font-medium group-hover:underline underline-offset-4 transition-all">Create account →</span>
</a>
</div>
</main>
<!-- Editorial Element -->
<div class="mb-8 px-6 py-4 rounded-xl tonal-glass border border-white/5 max-w-[320px] mx-auto hidden sm:flex items-center gap-4">
<div class="w-10 h-10 rounded-full kinetic-gradient flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div>
<p class="text-xs font-label text-primary uppercase tracking-widest">Daily Wisdom</p>
<p class="text-xs text-on-surface-variant italic">"Strength does not come from what you can do. It comes from overcoming the things you once thought you couldn't."</p>
</div>
</div>
</body></html>
